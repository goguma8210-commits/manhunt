<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MANHUNT</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#0d0f14;--panel:rgba(16,19,26,.93);--line:#2a2f3a;--txt:#f2f4f8;--mut:#9aa3b2;--run:#2ee59d;--hunt:#ff4d4d;--acc:#ffd23f;--blue:#3d8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
.hide{display:none!important}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#161a22;color:var(--txt);font-size:16px}
button{padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:#1c212b;color:var(--txt);font-size:15px;font-weight:700}
button.primary{background:var(--hunt);border-color:var(--hunt);color:#fff}
button.go{background:var(--run);border-color:var(--run);color:#06231a}
button.sm{padding:8px 12px;font-size:13px;white-space:nowrap}
button.on{outline:2px solid var(--acc)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mut{color:var(--mut);font-size:13px;line-height:1.5}
/* home */
#home{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;gap:12px;padding:22px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(to top,#0d0f14 70%,rgba(13,15,20,.85));border-radius:20px 20px 0 0}
#home h1{font-size:40px;letter-spacing:6px;margin:0;font-weight:900}
#home .sub{margin:0 0 6px;color:var(--mut)}
#help{position:fixed;inset:0;z-index:40;background:#07080b;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
#help .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#help .top h2{margin:0;font-size:22px;letter-spacing:2px}
#helpHome{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:520px;width:100%;margin:0 auto}
#helpHome .lead{color:var(--mut);text-align:center;margin:0 0 8px;line-height:1.6}
.hcard{display:flex;align-items:center;gap:16px;padding:20px;border-radius:18px;border:1px solid var(--line);background:#11141b;text-align:left;width:100%;animation:fadeUp .5s both}
.hcard:nth-child(3){animation-delay:.08s}.hcard:nth-child(4){animation-delay:.16s}
.hcard .ic{font-size:34px;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hcard b{display:block;font-size:19px;margin-bottom:3px}
.hcard span{color:var(--mut);font-size:13px;font-weight:500}
.hcard.g .ic{background:#2a2410}.hcard.r .ic{background:#0e2a20}.hcard.h .ic{background:#2c1012}
#helpDeck{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;min-height:0}
#tStage{position:relative;width:100%;aspect-ratio:5/3;border-radius:18px;background:radial-gradient(circle at 50% 40%,#1a1f2a,#0c0e13);border:1px solid var(--line);overflow:hidden;flex:0 0 auto}
#tStage svg{width:100%;height:100%;display:block}
#tStep{color:var(--mut);font-size:12px;font-weight:800;letter-spacing:2px;margin:16px 0 4px}
#tTitle{font-size:24px;font-weight:900;margin:0 0 8px}
#tDesc{color:#d6dbe4;font-size:15.5px;line-height:1.65;margin:0;overflow:auto}
#tDesc b{color:#fff}
.fadeUp{animation:fadeUp .45s both}.fadeUp2{animation:fadeUp .45s .12s both}.fadeUp3{animation:fadeUp .45s .22s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#tDots{display:flex;gap:6px;justify-content:center;margin:14px 0 10px}
#tDots i{width:7px;height:7px;border-radius:4px;background:#333a47;transition:all .25s}
#tDots i.on{width:22px;background:var(--acc)}
#tNav{display:flex;gap:10px;margin-top:auto}
#tNav button{flex:1}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.code{font-size:22px;font-weight:900;letter-spacing:3px}
.pl{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#161a22}
.pl .pn{flex:1;font-weight:700}
.pl .pd{color:var(--mut);font-size:13px}
.chip{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px}
.chip.runner{background:var(--run);color:#06231a}
.chip.hunter{background:var(--hunt);color:#fff}
/* hud */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{background:var(--panel);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}
.pill.role-runner{background:var(--run);color:#06231a}
.pill.role-hunter{background:var(--hunt);color:#fff}
#banner{position:fixed;left:12px;right:12px;top:calc(56px + env(safe-area-inset-top));z-index:12;background:#ff9f1c;color:#1a1000;font-weight:800;padding:10px 12px;border-radius:12px;text-align:center}
/* chat */
#chatBtn{position:fixed;right:12px;bottom:calc(var(--sheetH,200px) + 12px);z-index:11;width:54px;height:54px;border-radius:50%;padding:0;font-size:24px;background:var(--panel)}
#chatBtn .badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--hunt);color:#fff;font-size:12px;line-height:20px;padding:0 5px}
#tauntBtn{position:fixed;right:12px;bottom:calc(var(--sheetH,200px) + 76px);z-index:11;width:54px;height:54px;border-radius:50%;padding:0;font-size:24px;background:var(--panel)}
#chat{position:fixed;left:0;right:0;bottom:0;top:30%;z-index:22;background:#0f1218;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.6)}
#chat .hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:800}
#msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:#1c212b;font-size:15px;line-height:1.4;word-break:break-word}
.msg.mine{align-self:flex-end;background:var(--blue);color:#fff}
.msg .who{font-size:11px;color:var(--mut);margin-bottom:2px;font-weight:700}
.msg.sys{align-self:center;background:transparent;color:var(--mut);font-size:12px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0}
.quick button{flex:0 0 auto;padding:7px 11px;font-size:13px;border-radius:999px}
#chat form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#chat form input{flex:1;padding:12px}
#tauntView{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#tauntView img{max-width:100%;max-height:62vh;border-radius:14px;border:3px solid var(--run);transform:rotate(-2deg)}
#tauntView .t{font-size:22px;font-weight:900;color:var(--run)}
.gps{font-size:12px}
.steps{display:flex;gap:6px}
.steps button{flex:1;padding:9px 4px;font-size:13px;white-space:nowrap}
.steps button.done{color:var(--run);border-color:#1f5a44}
.steps button.on{background:var(--acc);color:#1a1300;border-color:var(--acc);outline:none}
.steps button:disabled{opacity:.35}
.sl{display:flex;align-items:center;gap:10px;margin:6px 0}
.sl span{width:78px;font-size:13px;color:var(--mut);font-weight:700}
.sl input{flex:1;accent-color:var(--acc);height:28px}
.sl b{width:36px;text-align:right;font-size:18px}
.cpBar{height:8px;border-radius:4px;background:#222833;overflow:hidden;margin-top:4px}
.cpBar>div{height:100%;background:var(--acc);transition:width .25s}
#codeBox{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:24px}
#codeBox .in{background:#161a22;border-radius:18px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
#codeBox input{font-size:34px;letter-spacing:12px;text-align:center;font-weight:900}
.myCode{font-size:44px;font-weight:900;letter-spacing:10px;font-family:ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:25;background:rgba(0,0,0,.85);padding:14px 20px;border-radius:14px;font-weight:800;font-size:17px;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
/* checkin bar */
.bar{height:12px;border-radius:6px;background:#222833;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--run);transition:width .9s linear}
/* compass */
#compass{display:flex;align-items:center;gap:14px}
#arrow{width:64px;height:64px;border-radius:50%;background:#161a22;border:2px solid var(--hunt);display:flex;align-items:center;justify-content:center;font-size:34px;transition:transform .25s}
/* overlays */
#blackout,#result{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#blackout{background:#000}
#blackout .big,#jail .big{font-size:56px;font-weight:900}
#result{background:rgba(5,6,9,.95)}
#result h2{font-size:34px;margin:0}
#jail{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:12;background:rgba(20,20,24,.94);border:2px solid #555;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
#jail .big{font-size:34px!important}
#jail .myCode{font-size:36px}
.maplibregl-ctrl-top-right{top:calc(56px + env(safe-area-inset-top))}
#pulse{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0}
#pulse.on{animation:beat var(--beat,1000ms) infinite}
@keyframes beat{0%{opacity:0;box-shadow:inset 0 0 70px 22px rgba(255,20,20,.9)}8%{opacity:1;box-shadow:inset 0 0 70px 22px rgba(255,20,20,.9)}22%{opacity:.25}32%{opacity:.85}100%{opacity:0;box-shadow:inset 0 0 70px 22px rgba(255,20,20,.9)}}
/* markers */
.mk{pointer-events:none;position:relative}
.mk .dot{width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.mk .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;margin-top:3px}
/* 신호기(체크포인트) 컨셉: 육각형 비컨 */
.mk.cp .dot,.mk.cand .dot,.mk.done .dot{width:30px;height:34px;border:none;border-radius:0;box-shadow:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;font-family:ui-monospace,Menlo,monospace}
.mk.cp .dot{background:var(--run);color:#06231a}
.mk.cand .dot{background:var(--acc);color:#3a2a00;opacity:.9}
.mk.done .dot{background:#2b313c;color:var(--run)}
.mk.cp{filter:drop-shadow(0 0 6px rgba(46,229,157,.8))}
.mk.later{filter:none}
.mk.later .dot{background:#1f5a44;color:#9fe9c9}
.mk.later::before{display:none}
.mk.cp::before{content:'';position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--run);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
.aim{width:120px;height:120px;pointer-events:none}
.aim svg{width:100%;height:100%;transition:opacity .3s}
.mk.me .dot{background:var(--blue);width:22px;height:22px}
.mk.runner .dot{background:var(--run)}
.mk.hunter .dot{background:var(--hunt)}
.mk.cand .dot{background:var(--acc);border-radius:5px}
.mk.cp .dot{background:var(--run);border-radius:5px}
.mk.done .dot{background:#666;border-radius:5px}
.mk.start .dot{background:#b06bff;width:24px;height:24px}
.mk.ping .dot{background:transparent;border:3px solid var(--run);width:28px;height:28px}
.mk.jail .dot{background:#888}
.mk.out .dot{background:#ff9f1c}
</style>
</head>
<body>
<div id="map"></div>

<!-- HOME -->
<div id="home">
  <h1>MANHUNT</h1>
  <p class="sub">GPS 술래잡기 · 테스트판</p>
  <input id="nameIn" placeholder="닉네임" maxlength="10">
  <button id="createBtn" class="primary">방 만들기</button>
  <div class="row"><input id="codeIn" placeholder="방 코드 6자리" inputmode="numeric" maxlength="6"><button id="joinBtn" style="flex:.45">참가</button></div>
  <button class="helpBtn">📖 게임 방법</button>
  <p class="mut" id="homeMsg">위치 권한을 허용해야 참가할 수 있어요. 게임 중엔 화면을 켜두세요.</p>
</div>


<!-- HELP -->
<div id="help" class="hide">
  <div class="top"><button class="sm" id="helpBack">←</button><h2 id="helpHead">게임 방법</h2><button class="sm" id="helpClose">닫기 ✕</button></div>
  <div id="helpHome">
    <p class="lead">실제 동네에서 하는 GPS 술래잡기.<br>궁금한 걸 골라보세요.</p>
    <button class="hcard g" data-deck="game"><div class="ic">🗺</div><div><b>게임 진행</b><span>팀, 구역, 시작, 승패</span></div></button>
    <button class="hcard r" data-deck="runner"><div class="ic">🏃</div><div><b>러너</b><span>신호기를 켜고 살아남기</span></div></button>
    <button class="hcard h" data-deck="hunter"><div class="ic">🔪</div><div><b>헌터</b><span>추적하고 잡기</span></div></button>
  </div>
  <div id="helpDeck" class="hide">
    <div id="tStage"></div>
    <div id="tStep"></div>
    <h3 id="tTitle"></h3>
    <p id="tDesc"></p>
    <div id="tDots"></div>
    <div id="tNav"><button id="tPrev">이전</button><button id="tNext" class="go">다음</button></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hide"></div>
<div id="banner" class="hide"></div>
<div id="toast"></div>
<div id="pulse"></div>

<!-- LOBBY -->
<div id="lobby" class="sheet hide">
  <div class="row" style="align-items:center">
    <div><div class="mut">방 코드</div><div class="code" id="codeLbl"></div></div>
    <button class="sm helpBtn" style="flex:0">📖 방법</button>
    <button class="sm" id="shareBtn" style="flex:0">링크 공유</button>
    <button class="sm" id="leaveBtn" style="flex:0">나가기</button>
  </div>
  <div id="hostTools" class="hide">
    <div class="steps">
      <button class="sm" data-step="zone">① 구역</button>
      <button class="sm" data-step="start">② 시작 지점</button>
      <button class="sm" data-step="cp">③ 체크포인트</button>
    </div>
    <p class="mut" id="toolHint" style="margin:8px 0 0"></p>
    <div id="zoneActs" class="row" style="margin-top:8px"><button class="sm" id="zoneUndo">↩︎ 되돌리기</button><button class="sm go" id="zoneDone">구역 저장 →</button></div>
    <div id="startActs" class="row" style="margin-top:8px"><button class="sm go" id="startNext">다음 →</button></div>
    <div id="cpActs" style="margin-top:8px">
      <div class="sl"><span>총 후보</span><input type="range" id="candTotal" min="3" max="12" step="1"><b id="candTotalLbl"></b></div>
      <div class="sl"><span>진짜 신호기</span><input type="range" id="realCnt" min="1" max="12" step="1"><b id="realCntLbl"></b></div>
      <div class="cpBar"><div id="cpFill"></div></div>
      <div class="row" style="margin-top:8px"><button class="sm" id="cpUndo">↩︎ 마지막 핀 지우기</button><button class="sm go" id="cpDone">설정 완료 ✓</button></div>
    </div>
  </div>
  <div class="mut" id="cfgLbl"></div>
  <div id="plist" style="display:flex;flex-direction:column;gap:6px"></div>
  <div class="row" id="hostBtns">
    <button id="randBtn">🎲 랜덤 배정</button>
    <button id="startBtn" class="primary">게임 시작</button>
  </div>
  <p class="mut hide" id="waitLbl">방장이 시작하길 기다리는 중…</p>
</div>

<!-- GAME PANEL -->
<div id="gamePanel" class="sheet hide">
  <div id="runnerUI" class="hide">
    <div class="mut" id="checkLbl">초록 신호기 원 안(20m)에서 30초 머무르면 확보</div>
    <div class="bar"><div id="checkBar"></div></div>
    <div class="row" id="runnerActs"><button id="soundBtn">🎧 심장소리 끔</button><button id="showCodeBtn">👁 내 코드</button><button id="rescueGoBtn" class="go">🤝 구출</button></div>
  </div>
  <div id="hunterUI" class="hide">
    <div id="compass"><div id="arrow">⬆</div><div class="mut" id="compassLbl">가장 가까운 러너 방향</div></div>
    <button id="catchBtn" class="primary">🔒 잡기 (러너 코드 입력)</button>
  </div>
</div>

<!-- CHAT / TAUNT -->
<button id="chatBtn" class="hide">💬<span class="badge hide" id="chatBadge"></span></button>
<button id="tauntBtn" class="hide">📸</button>
<input type="file" id="tauntFile" accept="image/*" capture="environment" class="hide">
<div id="chat" class="hide">
  <div class="hd"><span id="chatTitle">팀 채팅</span><button class="sm" id="chatClose">닫기</button></div>
  <div id="msgs"></div>
  <div class="quick" id="quick"></div>
  <form id="chatForm"><input id="chatIn" placeholder="팀에게만 보여요" maxlength="200" autocomplete="off"><button class="go" style="flex:0 0 auto">전송</button></form>
</div>
<div id="tauntView" class="hide">
  <div class="t" id="tauntTitle"></div>
  <img id="tauntImg" alt="">
  <div class="mut" id="tauntCap"></div>
  <button id="tauntClose">닫기</button>
</div>

<div id="codeBox" class="hide"><div class="in">
  <div style="font-weight:900;font-size:18px" id="codeTitle"></div>
  <div class="mut" id="codeSub"></div>
  <input id="codeEntry" inputmode="numeric" maxlength="4" autocomplete="off" pattern="[0-9]*">
  <div class="row"><button id="codeCancel">취소</button><button id="codeOk" class="go">확인</button></div>
</div></div>

<!-- JAIL -->
<div id="jail" class="hide">
  <div>⛓ 감옥</div>
  <div class="big" id="jailTimer">5:00</div>
  <div class="mut" id="jailInfo"></div>
  <div class="myCode" id="jailCode"></div>
  <button id="jailCodeBtn" class="go">🔑 구출 코드 보기</button>
</div>

<!-- BLACKOUT (hunter head start) -->
<div id="blackout" class="hide">
  <div>러너가 흩어지는 중…</div>
  <div class="big" id="boTimer">2:00</div>
  <div class="mut">시작 지점에서 대기하세요</div>
</div>

<!-- RESULT -->
<div id="result" class="hide">
  <h2 id="resTitle"></h2>
  <div class="mut" id="resInfo"></div>
  <button id="againBtn" class="primary">같은 멤버로 다시하기</button>
  <div class="mut hide" id="againWait">방장이 다시 시작하길 기다리는 중…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get, remove, push, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ====== 1. 여기에 Firebase 설정을 붙여넣으세요 ======
const firebaseConfig = {

let kf = null; // { lng, lat, v(분산 m²), t, raw }

// ====== 잡기·구출 코드 ======
// 코드는 "목숨 하나당 하나": 게임 시작/구출 때 새로 발급되고, 쓰이면 바로 폐기.
// 입력하는 사람이 대상 근처(40m, GPS 오차 감안)에 있어야 통과.
const CODE_R = 40;
const newCode = () => String(Math.floor(1000 + Math.random() * 9000));
const CODE_TTL = 30000; // 보기 누를 때마다 새 코드, 30초만 유효
let codeAction = null;
function askCode(title, sub, fn) {

}

};
$('#codeEntry').addEventListener('keydown', e => { if (e.key === 'Enter') $('#codeOk').click(); });
const near = p => !myPos || p.lat == null || dist(myPos, p) <= CODE_R;

};

$('#soundBtn').onclick = () => {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  soundOn = !soundOn;
  $('#soundBtn').textContent = soundOn ? '🎧 심장소리 켬' : '🎧 심장소리 끔';
  if (soundOn) thump();

// 나침반: 폰 자이로 대신 GPS 좌표로만 계산 → 지도 위 화살표 (지도는 항상 북쪽이 위)
let compassBearing = null, aimX = 0, aimY = 0, aimNear = false, aimMarker = null;
const AIM_SVG = '<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="44" fill="none" stroke="#ff4d4d" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/><path d="M60 4 L74 26 L60 20 L46 26 Z" fill="#ff4d4d" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
function smoothBearing(b) {
  // 각도를 벡터로 평균 내서 떨림 제거
  const r = b * D2R;
  aimX = aimX * 0.6 + Math.sin(r) * 0.4; aimY = aimY * 0.6 + Math.cos(r) * 0.4;
  return (Math.atan2(aimX, aimY) / D2R + 360) % 360;
}
function updateCompass() {
  const arrow = $('#arrow');
  if (compassBearing == null) { arrow.style.transform = ''; arrow.textContent = '·'; }
  else if (aimNear) { arrow.style.transform = ''; arrow.textContent = '‼'; }
  else { arrow.textContent = '⬆'; arrow.style.transform = `rotate(${compassBearing - map.getBearing()}deg)`; }
  const show = role0() === 'hunter' && compassBearing != null && myPos;
  if (!show) { if (aimMarker) { aimMarker.remove(); aimMarker = null; } return; }
  if (!aimMarker) {
    const el = document.createElement('div'); el.className = 'aim'; el.innerHTML = AIM_SVG;
    aimMarker = new maplibregl.Marker({ element: el, anchor: 'center', rotationAlignment: 'map' }).setLngLat([myPos.lng, myPos.lat]).addTo(map);
  }
  aimMarker.setLngLat([myPos.lng, myPos.lat]).setRotation(compassBearing);
  aimMarker.getElement().querySelector('svg').style.opacity = aimNear ? 0.25 : 1;
}
const role0 = () => (me() || {}).role;

// heartbeat
function setBeat(period) {
  if (period === beatPeriod) return;
  beatPeriod = period; clearInterval(beatTimer);
  const pulse = $('#pulse');
  if (!period) { pulse.classList.remove('on'); return; }
  pulse.style.setProperty('--beat', period + 'ms'); pulse.classList.add('on');
  beatTimer = setInterval(() => {
    if (soundOn) thump();
    if (navigator.vibrate) navigator.vibrate([60, 110, 40]);
  }, period);
}
function thump() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [0, 0.17].forEach((dt, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = i ? 48 : 62;
    g.gain.setValueAtTime(0.0001, t + dt);
    g.gain.exponentialRampToValueAtTime(i ? 0.6 : 0.95, t + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.16);
    o.connect(g).connect(audioCtx.destination); o.start(t + dt); o.stop(t + dt + 0.2);
  });
}

function tick() {
  if (!room || room.status !== 'playing') return;
  const cfg = room.config, m = me(), t = now();
  if (!m) return;
  const ps = players();
  const runners = ps.filter(([, p]) => p.role === 'runner');
  const pingMs = cfg.pingSec * 1000;

  // 구역 이탈 (전원)
  if (myPos && !m.caught && cfg.zone) {
    const inside = inPoly(myPos, cfg.zone) || edgeDist(myPos, cfg.zone) <= cfg.zoneBuffer;
    if (!inside) {
      if (!outSince) outSince = t;
      const left = cfg.outGraceSec - (t - outSince) / 1000;
      if (left > 0) banner(`⚠️ 구역 밖! ${Math.ceil(left)}초 안에 돌아오세요`);
      else { banner('🚨 구역 밖 — 내 위치가 상대 팀에 실시간 공개 중'); if (!m.out) update(meRef(), { out: true }); }
    } else { if (outSince || m.out) { outSince = null; banner(''); if (m.out) update(meRef(), { out: false }); } }
  }

  if (m.role === 'runner') {
    // 감옥 시간 초과
    if (m.caught && !m.eliminated && t > m.caughtAt + cfg.jailSec * 1000) update(meRef(), { eliminated: true });
    // 체크인
    const visited = room.visited || {}, cands = cfg.candidates || {};
    const order = cfg.real || [], nextIdx = order.findIndex(id => !visited[id]), nextId = order[nextIdx];
    const target = !m.caught && myPos && nextId && cands[nextId] && dist(myPos, cands[nextId]) <= cfg.checkinR + Math.min(15, Math.max(0, (rawAcc || 0) - 10)) ? nextId : null;
    if (!target) { checkin.cp = null; $('#checkBar').style.width = '0'; }
    else {
      if (checkin.cp !== target) checkin = { cp: target, since: t };
      const el = (t - checkin.since) / 1000;
      $('#checkBar').style.width = Math.min(100, el / cfg.checkinSec * 100) + '%';
      $('#checkLbl').textContent = `체크인 중… ${Math.max(0, Math.ceil(cfg.checkinSec - el))}초`;
      if (el >= cfg.checkinSec) { set(rRef('visited/' + target), { by: myId, at: t }); checkin.cp = null; toast('✅ 체크포인트 확보!'); }
    }
    if (!target) $('#checkLbl').textContent = nextId ? `다음: ${nextIdx + 1}번 신호기 — 원 안에서 30초 머무르면 확보` : '모든 신호기 확보!';
    // 심장소리: 가장 가까운 헌터
    let d = Infinity;
    if (myPos && !m.caught) ps.forEach(([, p]) => { if (p.role === 'hunter' && p.lat != null) d = Math.min(d, dist(myPos, p)); });
    if (t < room.huntStartAt) d = Infinity;
    distHist.push(d); if (distHist.length > 3) distHist.shift();
    const avg = distHist.reduce((a, b) => a + b, 0) / distHist.length;
    setBeat(avg <= 15 ? 450 : avg <= 30 ? 750 : avg <= 50 ? 1150 : 0);
  } else {
    setBeat(0);
    // 위치 핑
    if (t >= room.huntStartAt) {
      const idx = Math.floor((t - room.huntStartAt) / pingMs);
      if (idx >= 1 && idx !== lastPingIdx) {
        lastPingIdx = idx; pingSnap = {};
        runners.forEach(([id, p]) => { if (p.lat != null && !p.eliminated) pingSnap[id] = { lng: p.lng, lat: p.lat, name: p.name, at: t }; });
        toast('📡 러너 위치 공개');
      }
    }
    // 나침반: 가장 가까운 활동 중 러너
    let best = null, bd = Infinity;
    if (myPos) runners.forEach(([, p]) => { if (!p.caught && p.lat != null) { const dd = dist(myPos, p); if (dd < bd) { bd = dd; best = p; } } });
    if (best && t >= room.huntStartAt) {
      aimNear = bd < 25; // 25m 안에선 GPS 오차가 커서 방향 대신 경고
      compassBearing = smoothBearing(brg(myPos, best));
    } else { compassBearing = null; aimX = aimY = 0; }
    $('#compassLbl').textContent = compassBearing == null ? '추적 대상 없음' : aimNear ? '아주 가까이 있음! 눈으로 찾으세요' : '가장 가까운 러너 방향';
    updateCompass();
  }

  // 승패 판정 (방장)
  if (isHost() && !ending) {
    const vN = Object.keys(room.visited || {}).length;
    let w = null;
    if (vN >= cfg.winCount) w = 'runner';
    else if (runners.length && runners.every(([, p]) => p.caught)) w = 'hunter';
    else if (t >= room.endAt) w = 'hunter';
    if (w) { ending = true; update(rRef(), { status: 'ended', winner: w, endedAt: t }); }
  }
}
setInterval(() => { tick(); render(); }, 1000);

// ====== render ======
function render() {
  const seen = new Set();
  if (!room) { cleanup(seen); return; }
  const cfg = room.config || {}, m = me() || {}, st = room.status, t = now();
  const role = m.role, ps = players();
  if (mapReady) {
    map.getSource('zone').setData(zoneGeo(cfg.zone));
    const cands = cfg.candidates || {}, visited = room.visited || {};
    const nx = (cfg.real || []).find(id => !visited[id]);
    const circ = st === 'playing' && role === 'runner' && nx && cands[nx] ? [circle(cands[nx], cfg.checkinR)] : [];
    map.getSource('cpzone').setData({ type: 'FeatureCollection', features: circ });
  }

  show('#lobby', st === 'lobby');
  show('#gamePanel', st === 'playing' && !(m.role === 'runner' && m.caught));
  show('#result', st === 'ended');
  show('#hud', st !== 'lobby' || true);
  if (myPos) setM('me', myPos, 'me', '나', seen);

  // HUD
  let hud = `<span class="pill ${role ? 'role-' + role : ''}">${role === 'runner' ? '러너' : role === 'hunter' ? '헌터' : '-'}</span>`;
  if (st === 'playing') {
    const vN = Object.keys(room.visited || {}).length;
    hud += t < room.huntStartAt ? `<span class="pill">헌터 출발 ${fmt(room.huntStartAt - t)}</span>` : `<span class="pill">⏱ ${fmt(room.endAt - t)}</span>`;
    hud += `<span class="pill">🏁 ${vN}/${cfg.winCount}</span>`;
    if (t >= room.huntStartAt) {
      const pingMs = cfg.pingSec * 1000, idx = Math.floor((t - room.huntStartAt) / pingMs);
      hud += `<span class="pill">${role === 'runner' ? '노출까지' : '다음 핑'} ${fmt(room.huntStartAt + pingMs * (idx + 1) - t)}</span>`;
    }
  } else if (st === 'lobby') hud += `<span class="pill">대기실 · ${ps.length}명</span>`;
  hud += gpsGrade();
  $('#hud').innerHTML = hud;

  if (st === 'lobby') {
    $('#codeLbl').textContent = roomCode;
    const host = isHost();
    if (host && !autoStepped) { autoStepped = true; tool = firstUndone(cfg); }
    show('#hostTools', host); show('#hostBtns', host && !tool); show('#plist', !(host && tool)); show('#cfgLbl', !(host && tool)); show('#waitLbl', !host);
    const nC0 = Object.keys(cfg.candidates || {}).length, total = cfg.candTotal || 8, real = Math.min(cfg.winCount || 4, total);
    const hasZone = cfg.zone && cfg.zone.length >= 3;
    const doneMap = { zone: hasZone, start: !!cfg.start, cp: nC0 >= total };
    document.querySelectorAll('[data-step]').forEach(b => {
      const k = b.dataset.step;
      b.classList.toggle('on', k === tool); b.classList.toggle('done', doneMap[k] && k !== tool);
      b.disabled = (k === 'start' && !hasZone) || (k === 'cp' && (!hasZone || !cfg.start));
      b.textContent = { zone: '① 구역', start: '② 시작 지점', cp: '③ 체크포인트' }[k] + (doneMap[k] ? ' ✓' : '');
    });
    show('#zoneActs', tool === 'zone'); show('#startActs', tool === 'start' && !!cfg.start); show('#cpActs', tool === 'cp');
    if (tool === 'cp') {
      const ct = $('#candTotal'), rc = $('#realCnt');
      if (document.activeElement !== ct) { ct.value = total; $('#candTotalLbl').textContent = total; }
      rc.max = total;
      if (document.activeElement !== rc) { rc.value = real; $('#realCntLbl').textContent = real; }
      $('#cpFill').style.width = Math.min(100, nC0 / total * 100) + '%';
    }
    $('#toolHint').innerHTML = tool === 'zone' ? `<b>① 구역</b> — 경계를 따라 지도를 탭해 꼭짓점을 찍으세요 · ${zoneDraft.length}개${zoneDraft.length >= 3 ? ' → 구역 저장' : ''}`
      : tool === 'start' ? `<b>② 시작 지점</b> — ${cfg.start ? '다시 탭하면 옮겨져요' : '구역 안에서 모두 모일 곳을 탭하세요'}`
      : tool === 'cp' ? `<b>③ 체크포인트</b> — 후보 ${total}개 중 <b>${real}개</b>가 진짜 신호기가 돼요. 지도를 탭해 핀을 찍으세요 <b>${nC0}/${total}</b>`
      : (firstUndone(cfg) ? '설정이 남았어요. 위 단계를 눌러 마무리하세요' : '✓ 설정 완료 · 참가자를 탭하면 러너/헌터가 바뀌어요');
    const nC = Object.keys(cfg.candidates || {}).length;
    $('#cfgLbl').textContent = `신호기 후보 ${nC}/${cfg.candTotal || 8}곳 중 진짜 ${cfg.winCount}곳 · 핑 ${cfg.pingSec}초 · ${cfg.durationMin}분`;
    $('#plist').innerHTML = ps.map(([id, p]) => {
      const d = cfg.start && p.lat != null ? dist(p, cfg.start) : null;
      return `<div class="pl" data-id="${id}"><span class="chip ${p.role}">${p.role === 'runner' ? '러너' : '헌터'}</span><span class="pn">${esc(p.name)}${id === room.host ? ' 👑' : ''}${id === myId ? ' (나)' : ''}</span><span class="pd">${d == null ? '—' : Math.round(d) + 'm'} ${d != null && d <= cfg.startR ? '✅' : ''}</span></div>`;
    }).join('');
    Object.entries(cfg.candidates || {}).forEach(([id, c]) => setM('c_' + id, c, 'cand', '', seen, '?'));
    if (cfg.start) setM('start', cfg.start, 'start', '시작', seen);
    ps.forEach(([id, p]) => { if (id !== myId) setM('p_' + id, p, p.role, p.name, seen); });
    show('#jail', false); show('#blackout', false);
  }

  if (st === 'playing') {
    const cands = cfg.candidates || {}, visited = room.visited || {};
    show('#runnerUI', role === 'runner'); show('#hunterUI', role === 'hunter');
    show('#blackout', role === 'hunter' && t < room.huntStartAt);
    if (role === 'hunter') $('#boTimer').textContent = fmt(room.huntStartAt - t);
    // 감옥
    const jailed = role === 'runner' && m.caught;
    show('#jail', jailed);
    if (jailed) {
      $('#jailTimer').textContent = m.eliminated ? '탈락' : fmt(m.caughtAt + cfg.jailSec * 1000 - t);
      const canRescue = !m.eliminated && (m.rescues || 0) < 1;
      const codeLive = canRescue && m.rescueCode && t < (m.rescueExp || 0);
      $('#jailCode').textContent = codeLive ? `${m.rescueCode}` : '';
      show('#jailCodeBtn', canRescue && !codeLive);
      $('#jailInfo').textContent = m.eliminated ? '관전 중 (자기 팀만 보여요)' : !canRescue ? '이미 한 번 구출받아서 더 이상 구출될 수 없어요' : codeLive ? `구출 코드 · ${Math.ceil((m.rescueExp - t) / 1000)}초 남음` : '동료가 와서 터치하면 코드를 보여주세요';
    }
    show('#runnerActs', role === 'runner' && !m.caught);
    if (m.immuneUntil && t < m.immuneUntil) { banner(`🛡 무적 ${Math.ceil((m.immuneUntil - t) / 1000)}초`); immuneShown = true; }
    else if (immuneShown) { immuneShown = false; banner(''); }

    if (role === 'runner') {
      const nx2 = (cfg.real || []).find(id => !visited[id]);
      (cfg.real || []).forEach((id, i) => { if (cands[id]) setM('c_' + id, cands[id], visited[id] ? 'done' : id === nx2 ? 'cp' : 'cp later', visited[id] ? '확보' : id === nx2 ? '다음' : '', seen, visited[id] ? '✓' : String(i + 1)); });
      ps.forEach(([id, p]) => {
        if (id === myId) return;
        if (p.role === 'runner') setM('p_' + id, p, p.caught ? 'jail' : 'runner', p.name + (p.caught ? ' ⛓' : ''), seen);
        else if (p.out) setM('p_' + id, p, 'out', p.name + ' (이탈)', seen);
      });
    } else {
      Object.entries(cands).forEach(([id, c]) => setM('c_' + id, c, 'cand', '', seen, '?'));
      ps.forEach(([id, p]) => {
        if (id === myId) return;
        if (p.role === 'hunter') setM('p_' + id, p, 'hunter', p.name, seen);
        else if (p.caught) setM('p_' + id, p, 'jail', p.name + ' ⛓', seen);
        else if (p.out) setM('p_' + id, p, 'out', p.name + ' (이탈)', seen);
      });
      Object.entries(pingSnap).forEach(([id, s]) => {
        const p = room.players[id];
        if (p && !p.caught && !p.out) setM('s_' + id, s, 'ping', `${s.name} · ${Math.round((t - s.at) / 1000)}초 전`, seen);
      });
    }
  }

  if (st !== 'playing' && aimMarker) { aimMarker.remove(); aimMarker = null; }
  const inGame = st === 'playing';
  setChatTeam(inGame ? role : null);
  show('#chatBtn', inGame);
  show('#tauntBtn', inGame && role === 'runner' && !m.eliminated && t >= room.huntStartAt);
  if (!inGame) { show('#chat', false); show('#tauntView', false); chatOpen = false; }
  const gp = $('#gamePanel'); document.documentElement.style.setProperty('--sheetH', (inGame ? Math.max(gp.offsetHeight, $('#jail').offsetHeight + 14) : 0) + 'px');
  if (st === 'ended') {

    show('#againBtn', isHost()); show('#againWait', !isHost());
    ps.forEach(([id, p]) => { if (id !== myId) setM('p_' + id, p, p.role, p.name, seen); });
  }
  cleanup(seen);
}

        + mover(C.hunt, 5, 'M30 30 L75 62', '0;.3;1', '0;1;1', 9) + mover(C.hunt, 5, 'M280 160 L215 120', '0;.6;1', '0;1;1', 9)

    { t: '처음 2분은 기다려요', d: '게임이 시작되면 헌터 화면은 <b>2분간 꺼져요</b>. 러너가 흩어지는 시간이에요. 시작 지점에서 기다렸다가 추격 시작!',
      s: () => phone(100, 15, 100, 150, txt(150, 60, '😑', '#fff', 26) + txt(150, 98, '1:59', '#fff', 28, `<animate attributeName="opacity" values="1;.35;1" dur="1s" repeatCount="indefinite"/>`) + txt(150, 125, '러너가 흩어지는 중…', C.gray, 9))
        + mover(C.run, 3, 'M90 90 L20 40', '0;1', '0;1', 6) + mover(C.run, 3, 'M210 90 L285 140', '0;1', '0;1', 6) },
    { t: '빨간 화살표를 따라가', d: '지도 위 내 위치 둘레의 <b>빨간 화살표</b>가 <b>가장 가까운 러너 방향</b>을 항상 가리켜요. 25m 안으로 들어오면 "눈으로 찾으세요"로 바뀌어요.',
      s: () => `<circle cx="150" cy="90" r="40" fill="none" stroke="${C.hunt}" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/>` + dot(150, 90, C.blue, 9)
        + `<g><path d="M150 42 L160 58 L150 54 L140 58 Z" fill="${C.hunt}" stroke="#fff" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" from="0 150 90" to="360 150 90" dur="8s" repeatCount="indefinite"/></g>`
        + mover(C.run, 8, 'M150 18 A72 72 0 1 1 149.9 18', '0;1', '0;1', 7) },

    { t: '신호기를 추리해 매복', d: '헌터 지도엔 <b>후보 신호기(?)</b>가 전부 보여요. 이 중 일부만 진짜고 순서도 몰라요. 🏁 진행도와 러너 동선을 보고 <b>다음 신호기를 예측해서 매복</b>!',
      s: () => [[50, 50], [120, 35], [210, 45], [260, 110], [170, 130], [70, 130]].map(([x, y], i) => hex(x, y, C.acc, '?', i === 4 ? `<animate attributeName="fill" dur="5s" repeatCount="indefinite" keyTimes="0;.4;.42;1" values="${C.acc};${C.acc};#ff9f1c;#ff9f1c"/>` : '')).join('')
        + mover(C.hunt, 5, 'M150 70 L158 118', '0;.45;.9;1', '0;0;1;1', 8)
        + `<rect x="118" y="78" width="64" height="22" rx="11" fill="#10131a" stroke="#2a2f3a"/>` + txt(150, 93, '🏁 2/4', '#fff', 11) },

      s: () => dot(150, 95, C.run, 9) + [['M150 10 L150 70'], ['M290 95 L175 95'], ['M150 175 L150 120'], ['M10 95 L125 95']].map(([pth]) => mover(C.hunt, 4, pth, '0;.8;1', '0;1;1', 8)).join('')
        + `<g opacity="0">${appear(4, .05)}<rect x="10" y="12" width="92" height="24" rx="12" fill="#1c212b"/>${txt(56, 28, '포위하자 💬', '#fff', 11)}</g>`
        + `<g opacity="0">${appear(4, .25)}<rect x="196" y="140" width="94" height="24" rx="12" fill="#1c212b"/>${txt(243, 156, '여기 막을게', '#fff', 11)}</g>` },

};
let deck = null, slide = 0;
function openDeck(k) { deck = k; slide = 0; show('#helpHome', false); show('#helpDeck', true); renderSlide(); }
function helpHome() { deck = null; show('#helpDeck', false); show('#helpHome', true); $('#helpHead').textContent = '게임 방법'; }
function renderSlide() {
  const D = DECKS[deck], S = D.slides[slide];
  $('#helpHead').textContent = D.name;
  $('#tStage').innerHTML = svgWrap(S.s());
  $('#tStep').textContent = `${D.name} · ${slide + 1} / ${D.slides.length}`;
  [['#tStep', 'fadeUp'], ['#tTitle', 'fadeUp2'], ['#tDesc', 'fadeUp3']].forEach(([sel, c]) => { const el = $(sel); el.classList.remove(c); void el.offsetWidth; el.classList.add(c); });
  $('#tTitle').textContent = S.t; $('#tDesc').innerHTML = S.d;
  $('#tDots').innerHTML = D.slides.map((_, i) => `<i class="${i === slide ? 'on' : ''}"></i>`).join('');
  $('#tPrev').textContent = slide === 0 ? '처음으로' : '이전';
  $('#tNext').textContent = slide === D.slides.length - 1 ? '다른 역할 보기' : '다음';
}
function stepSlide(d) {
  if (!deck) return;
  const n = DECKS[deck].slides.length;
  if (slide + d < 0 || slide + d >= n) return helpHome();
  slide += d; renderSlide();
}
document.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => openDeck(b.dataset.deck));
$('#tPrev').onclick = () => stepSlide(-1);
$('#tNext').onclick = () => stepSlide(1);
$('#helpBack').onclick = () => deck ? helpHome() : show('#help', false);
let swX = null;
$('#helpDeck').addEventListener('touchstart', e => { swX = e.touches[0].clientX; }, { passive: true });
$('#helpDeck').addEventListener('touchend', e => { if (swX == null) return; const dx = e.changedTouches[0].clientX - swX; swX = null; if (Math.abs(dx) > 50) stepSlide(dx < 0 ? 1 : -1); });
document.querySelectorAll('.helpBtn').forEach(b => b.onclick = () => {
  show('#help', true);
  const r = (me() || {}).role;
  if (room && room.status === 'playing' && r) openDeck(r); else helpHome();
});
$('#helpClose').onclick = () => show('#help', false);
// 처음 열 때 내 위치로 지도 이동
ensureGeo().catch(() => {});
$('#againBtn').onclick = () => update(rRef(), { status: 'lobby', winner: null, visited: null });
</script>
